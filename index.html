<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal App Just Vanilla JavaScript</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div>
        <label for="goal" class="goal">Add Goal</label>
        <p class="screenshot">It’s not permanent. The data will be lost when the page is refreshed. If you want, you can take a screenshot after creating your goal.</p>
        <textarea rows="3" cols="80" placeholder="Enter your goal here..."></textarea>
        <button>Create Goal</button>
      </div>
      <ul></ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
